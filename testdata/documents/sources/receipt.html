<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { width: 720px; margin: 0; padding: 70px 110px; color: #171717; background: #ddd8cd; font-family: "Courier New", monospace; }
      main { min-height: 920px; padding: 52px 42px; background: #fffef9; box-shadow: 0 7px 24px #7775; }
      h1 { margin: 0; font-size: 28px; text-align: center; }
      .meta { margin: 14px 0 42px; text-align: center; }
      .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #777; }
      .total { margin-top: 28px; padding-top: 18px; border-top: 3px double #222; font-size: 22px; font-weight: bold; }
      footer { margin-top: 70px; font-size: 15px; line-height: 1.6; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>TEST MARKET 130</h1>
      <div class="meta">130 Example Road<br />Receipt 000130<br />September 19, 2026</div>
      <div class="row"><span>Notebook</span><span>$6.50</span></div>
      <div class="row"><span>Printer paper</span><span>$9.25</span></div>
      <div class="row"><span>Black ink</span><span>$18.00</span></div>
      <div class="row"><span>Tax</span><span>$2.70</span></div>
      <div class="row total"><span>TOTAL</span><span>$36.45</span></div>
      <div class="row"><span>Card payment</span><span>$36.45</span></div>
      <footer>SYNTHETIC TEST RECEIPT<br />Not a real purchase</footer>
    </main>
  </body>
</html>
